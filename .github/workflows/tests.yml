name: Booking tool checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked ruff check guest_support tests server.py
      - run: uv run --locked ruff format --check guest_support tests server.py
