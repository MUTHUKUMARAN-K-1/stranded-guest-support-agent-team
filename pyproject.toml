[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stranded-guest-support"
version = "0.1.0"
description = "Six policy-checked FastMCP tools for the Zero Lisbon guest-support exercise"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["guest_support*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
